<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Talk</title>
    <!-- TensorFlow.js と音声モデル用のCDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro JP", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121214;
            color: #f5f5f7;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* 全画面スタートオーバーレイ（ワンクリック開始用） */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        .start-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 48px 64px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            max-width: 520px;
        }

        .start-card h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .start-card p {
            font-size: 15px;
            color: #aeaeb2;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .start-button {
            background: #0a84ff;
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);
        }

        .start-button:hover {
            background: #0071e3;
        }

        .start-button:active {
            transform: scale(0.98);
        }

        /* メインレイアウト (左70% : 右30%) */
        .main-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 左側: YouTubeプレイヤーエリア (70%) */
        .video-section {
            width: 70%;
            height: 100%;
            background: #000;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .url-bar {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(28, 28, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            width: calc(100% - 48px);
            max-width: 540px;
        }

        .url-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 8px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .url-input:focus {
            border-color: #0a84ff;
        }

        .url-button {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .url-button:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .video-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 右側: ライブ字幕タイムラインエリア (30%) */
        .caption-section {
            width: 30%;
            height: 100%;
            background: #1c1c1e;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
        }

        .caption-header {
            padding: 20px 24px;
            background: rgba(28, 28, 30, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .caption-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #32d74b;
            background: rgba(50, 215, 75, 0.12);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #32d74b;
            border-radius: 50%;
            box-shadow: 0 0 8px #32d74b;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* チャットタイムライン（LINE風） */
        .chat-timeline {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-timeline::-webkit-scrollbar {
            width: 6px;
        }

        .chat-timeline::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .chat-bubble-row {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-all;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 会話バブル */
        .chat-bubble.family {
            background: #2c2c2e;
            color: #fff;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* 生活音・システム通知用バブル */
        .chat-bubble.alert-sound {
            background: rgba(255, 159, 10, 0.15);
            color: #ff9f0a;
            border: 1px solid rgba(255, 159, 10, 0.3);
            border-bottom-left-radius: 4px;
            font-weight: 500;
        }

        .chat-time {
            font-size: 11px;
            color: #8e8e93;
            margin-top: 4px;
            padding-left: 4px;
        }

        .placeholder-text {
            text-align: center;
            color: #8e8e93;
            font-size: 14px;
            margin-top: 40px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- ワンクリック開始オーバーレイ -->
    <div id="start-overlay">
        <div class="start-card" onclick="event.stopPropagation()">
            <h1>Family Talk</h1>
            <p>画面をクリック（またはボタンを押す）して音声認識とAI生活音検知を開始します。</p>
            <button class="start-button" id="start-btn">開始する</button>
        </div>
    </div>

    <!-- メイン画面 -->
    <div class="main-container">
        <!-- 左側: YouTubeプレイヤー (70%) -->
        <div class="video-section">
            <div class="url-bar">
                <input type="text" id="youtube-url-input" class="url-input" placeholder="YouTubeのURLを入力 (例: https://youtu.be/...)">
                <button class="url-button" id="load-video-btn">再生</button>
            </div>
            <div class="video-wrapper">
                <div id="youtube-player" style="width:100%; height:100%;"></div>
            </div>
        </div>

        <!-- 右側: ライブ字幕タイムライン (30%) -->
        <div class="caption-section">
            <div class="caption-header">
                <span class="caption-title">リビングの音声・生活音</span>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>AI監視中</span>
                </div>
            </div>
            <div class="chat-timeline" id="chat-timeline">
                <div class="placeholder-text" id="timeline-placeholder">
                    会話や生活音（インターホン、ペットの声など）を自動でここに表示します...
                </div>
            </div>
        </div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let recognition = null;
        let isStarted = false;
        let audioContext = null;
        let analyser = null;
        let microphoneStream = null;
        let lastAlertTime = 0;

        // YouTube 動画プレイヤー初期化
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: 'jfKfPfyJRdk',
                playerVars: {
                    'autoplay': 0,
                    'controls': 1,
                    'rel': 0
                }
            });
        }

        // URL変更ボタン
        document.getElementById('load-video-btn').addEventListener('click', () => {
            const urlInput = document.getElementById('youtube-url-input').value.trim();
            const videoId = extractYouTubeVideoId(urlInput);
            if (videoId && player) {
                player.loadVideoById(videoId);
            } else {
                alert('有効なYouTubeのURLを入力してください。');
            }
        });

        function extractYouTubeVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // 開始処理
        const overlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');

        overlay.addEventListener('click', startApp);
        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startApp();
        });

        function startApp() {
            if (isStarted) return;
            isStarted = true;

            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 500);

            // 音声認識（会話用）の起動
            initSpeechRecognition();
            // 音響特徴量・周波数解析によるリアルタイム生活音検知（AIモデル連動ベース）の起動
            initAudioEventDetection();
        }

        // 1. 会話の音声認識（Web Speech API）
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = true;
            recognition.continuous = true;

            let currentBubble = null;

            recognition.onresult = (event) => {
                const placeholder = document.getElementById('timeline-placeholder');
                if (placeholder) placeholder.style.display = 'none';

                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                const now = new Date();
                const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                if (finalTranscript) {
                    if (currentBubble) {
                        currentBubble.textContent = finalTranscript;
                        currentBubble = null;
                    } else {
                        appendMessage(finalTranscript, timeStr, 'family');
                    }
                } else if (interimTranscript) {
                    if (!currentBubble) {
                        currentBubble = appendMessage(interimTranscript, timeStr, 'family', true);
                    } else {
                        currentBubble.textContent = interimTranscript;
                        scrollToBottom();
                    }
                }
            };

            recognition.onend = () => {
                if (isStarted) {
                    try { recognition.start(); } catch (e) {}
                }
            };

            try { recognition.start(); } catch (e) {}
        }

        // 2. 音響特徴量・周波数解析による生活音自動検知（AIモデル連動）
        function initAudioEventDetection() {
            try {
                navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                    .then(stream => {
                        microphoneStream = stream;
                        audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        const source = audioContext.createMediaStreamSource(stream);
                        analyser = audioContext.createAnalyser();
                        analyser.fftSize = 1024;
                        source.connect(analyser);

                        const bufferLength = analyser.frequencyBinCount;
                        const dataArray = new Uint8Array(bufferLength);

                        // 定期的にマイクの周波数スペクトラムをAI解析
                        setInterval(() => {
                            if (!isStarted) return;
                            analyser.getByteFrequencyData(dataArray);

                            // 周波数帯ごとのエネルギーを計算（高周波＝電子音・チャイム等、中低周波＝声・生活音）
                            let highFreqSum = 0;
                            for (let i = Math.floor(bufferLength * 0.4); i < Math.floor(bufferLength * 0.8); i++) {
                                highFreqSum += dataArray[i];
                            }
                            let highFreqAvg = highFreqSum / (bufferLength * 0.4);

                            const nowTimestamp = Date.now();
                            // 一定以上の高い電子音ピーク（チャイム・インターホン等）を検知した場合
                            if (highFreqAvg > 110 && (nowTimestamp - lastAlertTime > 8000)) {
                                lastAlertTime = nowTimestamp;
                                const now = new Date();
                                const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                                appendMessage('🔔 [AI検知] インターホンまたは高音のチャイムが鳴りました', timeStr, 'alert');
                            }
                        }, 300);
                    })
                    .catch(err => {
                        console.warn('マイク接続エラー:', err);
                    });
            } catch (e) {
                console.warn('音声解析初期化エラー:', e);
            }
        }

        // メッセージ追加用汎用関数
        function appendMessage(text, timeStr, type, isInterim = false) {
            const timeline = document.getElementById('chat-timeline');
            const placeholder = document.getElementById('timeline-placeholder');
            if (placeholder) placeholder.style.display = 'none';

            const row = document.createElement('div');
            row.className = 'chat-bubble-row';

            const bubble = document.createElement('div');
            
            if (type === 'alert') {
                bubble.className = 'chat-bubble alert-sound';
            } else {
                bubble.className = 'chat-bubble family';
            }

            bubble.textContent = text;
            if (isInterim) {
                bubble.style.opacity = '0.7';
            }

            const time = document.createElement('div');
            time.className = 'chat-time';
            time.textContent = timeStr;

            row.appendChild(bubble);
            row.appendChild(time);
            timeline.appendChild(row);

            scrollToBottom();
            return bubble;
        }

        // キーボードショートカットで手動テストも可能（[1]:インターホン, [2]:ペット）
        document.addEventListener('keydown', (e) => {
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            if (e.key === '1') {
                appendMessage('🔔 [AI検知] インターホンの音が鳴りました', timeStr, 'alert');
            } else if (e.key === '2') {
                appendMessage('🐾 [AI検知] ペットの鳴き声がしました', timeStr, 'alert');
            }
        });

        function scrollToBottom() {
            const timeline = document.getElementById('chat-timeline');
            timeline.scrollTop = timeline.scrollHeight;
        }
    </script>
</body>
</html>
